<!doctype html>
<html lang="en" class="scroll-smooth bg-[#09090B] text-[#F4F4F5]">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Editfolio — Professional Video Editor Portfolio & Showreel Template</title>
    <meta name="title" content="Editfolio — Professional Video Editor Portfolio & Showreel Template" />
    <meta name="description" content="Professional portfolio and showreel template for freelance video editors. Showcases short-form reels, commercial films, and 4K video deliveries." />
    <meta name="keywords" content="Video Editor, Freelance Video Editor, Short Form Video Editor, Reels Editor, TikTok Editor, Commercial Video Editor, DaVinci Resolve Colorist, Premiere Pro Editor, UGC Video Ads, Video Post Production" />
    <meta name="author" content="Editfolio" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#0A0A0C" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Editfolio — Professional Video Editor Portfolio" />
    <meta property="og:description" content="High-retention video editing portfolio with interactive 4K video reel showcase." />
    <meta property="og:image" content="/profile.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Video Editor Portfolio" />
    <meta property="og:site_name" content="Editfolio" />

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Editfolio — Professional Video Editor Portfolio" />
    <meta name="twitter:description" content="High-retention short-form video editing and commercial showreel template." />
    <meta name="twitter:image" content="/profile.jpg" />

    <!-- Google Fonts: Plus Jakarta Sans, Outfit, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- JSON-LD Structured Data Schema for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Video Editor Portfolio",
      "jobTitle": "Freelance Video Editor & Visual Storyteller",
      "description": "Professional video editor specializing in high-retention short-form, commercial brand films, and color grading.",
      "knowsAbout": [
        "Video Editing",
        "Adobe Premiere Pro",
        "DaVinci Resolve Studio",
        "Color Grading",
        "Short-Form Video Editing",
        "Instagram Reels & TikTok Editing",
        "Commercial Brand Films",
        "UGC Video Advertising",
        "Sound Design & Audio Mastering"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Video Post-Production Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Commercial Video Editing"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Short-Form & Reels Retention Editing"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "UGC & Direct Response Video Ads"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "DaVinci Resolve Color Grading & Finishing"
            }
          }
        ]
      }
    }
    </script>
  </head>
  <body class="bg-[#ECEBE8] text-[#0D0D0D] antialiased selection:bg-[#E63E26] selection:text-white overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
